# Manifest de dependencias del componente "orbita_audio" (gestionado por ESP-IDF,
# lo resuelve/descarga solo "idf.py build" o "idf.py reconfigure", no hay
# que instalar nada a mano).
#
# esp-sr: libreria de Espressif con el Audio Front-End (AFE) -- NS, VAD,
# beamforming -- que vamos a integrar en esta etapa. Todavia no se usa en
# el codigo (paso 1 = que compile con la dependencia sumada, sin tocar
# audio_capture.c/main.c todavia).
dependencies:
  espressif/esp-sr: "^2.5.5"
